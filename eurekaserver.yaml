server:
  port: 8070

eureka:
  instance:
    hostname: localhost
  client:
    # Eureka server is not going to call the registry of any other service, rather other service will call Eureka server's registry
    fetchRegistry: false
    # Don't register will yourself and don't add your details in the registry
    registerWithEureka: false
    serviceUrl:
      # Other services register here and discover other services here
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/